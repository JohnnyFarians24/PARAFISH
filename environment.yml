# Conda environment for PARAFISH (used by the Dockerfile; also: conda env create -f environment.yml).
# Versions follow the environment that produced the Guadiana results (Ubuntu 24.04 server,
# October 2026), which is known to resolve together. BLAST is left unpinned: older builds
# (2.15.0) require libzlib < 1.3 and cannot be installed next to current R packages.
name: parafish
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13
  - pip
  - fastqc=0.13.0
  - trimmomatic=0.39
  - vsearch=2.32.0
  - mafft=7.526
  - raxml-ng=2.0.3
  - fasttree=2.2.0
  - pear=0.9.11
  - blast
  - r-base=4.5
  - bioconductor-dada2=1.38.0
  - openjdk
  - wget
  - curl
